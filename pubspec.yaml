name: buscamigos
description: "Encuentra a tu grupo en festivales, conciertos y eventos masivos."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado
  provider: ^6.1.2

  # Persistencia local (clave-valor rápido, todo el grupo cabe aquí)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Localización + brújula
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1
  permission_handler: ^11.3.1

  # Bluetooth para distancia fina cuando hay miembros cerca
  flutter_blue_plus: ^1.34.5

  # Crypto E2E. Dart puro, sin compilación nativa, mantenido.
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2  # acelera AES en plataformas que lo soportan

  # QR para crear/unirse
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Utilidades
  uuid: ^4.5.1
  collection: ^1.18.0
  vector_math: ^2.1.4
  flutter_nearby_connections_plus: ^1.2.2
  sensors_plus: ^6.0.0
  share_plus: ^11.0.0

  # Mantener pantalla activa en Modo Búsqueda (wake lock)
  wakelock_plus: ^1.2.8

  # Notificaciones pop locales (mensajes + SOS)
  flutter_local_notifications: ^17.2.3

  # Foreground service: mantener app viva en segundo plano
  flutter_foreground_task: ^8.10.0

  # Mapas OpenStreetMap (sin API key) + utilidades de coordenadas
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2  # para descargar tiles del mapa

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
