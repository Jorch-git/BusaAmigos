name: buscamigos
description: "Encuentra a tu grupo en festivales, conciertos y eventos masivos."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado
  provider: ^6.1.2

  # Persistencia local
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Localización + brújula
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1
  permission_handler: ^11.3.1

  # Sensores inerciales (acelerómetro/giroscopio/magnetómetro) para la fusión
  # de rumbo y el dead reckoning. NUEVO.
  sensors_plus: ^7.0.0

  # Bluetooth para distancia fina cuando hay miembros cerca
  flutter_blue_plus: ^1.34.5

  # Crypto E2E. Dart puro, sin compilación nativa, mantenido.
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2

  # QR para crear/unirse
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Compartir el log exportado (JSON/CSV). NUEVO.
  share_plus: ^11.0.0

  # Utilidades
  uuid: ^4.5.1
  collection: ^1.18.0
  vector_math: ^2.1.4
  flutter_nearby_connections_plus: ^1.2.2
  wakelock_plus: ^1.4.0

  # --- OPCIONAL: transporte Bridgefy (mesh BLE + Wi-Fi Direct, cross-platform).
  # Requiere API key (bridgefy.me). Descomenta esta línea Y copia
  # opcional_bridgefy/bridgefy_transport.dart a lib/services/transport/bridgefy/
  # para activarlo.
  # bridgefy: ^1.1.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
