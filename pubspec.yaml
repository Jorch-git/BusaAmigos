name: buscamigos
description: "Encuentra a tu grupo en festivales, conciertos y eventos masivos."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado
  provider: ^6.1.2

  # Persistencia local (clave-valor rápido, todo el grupo cabe aquí)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Localización + brújula
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1
  permission_handler: ^11.3.1

  # Sensores IMU: acelerómetro, giroscopio, magnetómetro (fusión de rumbo).
  # Lo usan sensor_fusion_service.dart y beacon_config.dart.
  sensors_plus: ^6.0.0

  # Bluetooth: escaneo (central) para leer RSSI de proximidad
  flutter_blue_plus: ^1.34.5
  # Bluetooth: advertising (peripheral) para que los demás nos detecten.
  flutter_ble_peripheral: ^2.1.0

  # Crypto E2E. Dart puro, sin compilación nativa, mantenido.
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2

  # QR para crear/unirse
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Utilidades
  uuid: ^4.5.1
  collection: ^1.18.0
  vector_math: ^2.1.4
  # Copia local con parches (ver packages/flutter_nearby_connections_plus/PARCHES.md)
  flutter_nearby_connections_plus:
    path: packages/flutter_nearby_connections_plus

  # Mantener pantalla activa en Modo Búsqueda (wake lock)
  wakelock_plus: ^1.2.8

  # Notificaciones pop locales (mensajes + SOS)
  flutter_local_notifications: ^17.2.3

  # Foreground service: mantener app viva en segundo plano
  flutter_foreground_task: ^8.10.0

  # Mapas OpenStreetMap (sin API key) + utilidades de coordenadas
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2

  # Compartir/exportar archivos (log de sesión a JSON/CSV).
  # Lo usan event_log_screen.dart y log_exporter.dart. La API
  # SharePlus.instance.share(ShareParams(...)) es de la versión 11.x.
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icono_fuente_1024.png"
  remove_alpha_ios: true